name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 2.0.4'
        required: true
        default: '2.0.4'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SimpleTune
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Missing repository secrets KEYSTORE_BASE64 and/or KEYSTORE_PASSWORD. A signed release APK cannot be produced without them."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/roxify.jks
          printf 'storeFile=roxify.jks\nstorePassword=%s\nkeyAlias=roxify\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore/key.properties

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="v${INPUT_VERSION#v}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon "-PVIBEON_VERSION_NAME=${{ steps.version.outputs.version }}"

      - name: Rename APK
        working-directory: SimpleTune
        run: mv app/build/outputs/apk/release/app-release.apk "../ROXIFY_${{ steps.version.outputs.tag }}.apk"

      - name: Clean stale release assets
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          rel_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}"
          rel_url=$(curl -sS -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "${rel_api}" | jq -r '.url // empty')
          if [ -n "${rel_url}" ]; then
            for id in $(curl -sS -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "${rel_url}/assets" | jq -r --arg keep "ROXIFY_${TAG}.apk" '.[] | select(.name != $keep) | .id'); do
              curl -sS -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "${rel_url}/assets/${id}"
            done
          fi

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: "Release ${{ steps.version.outputs.tag }}"
          files: ROXIFY_${{ steps.version.outputs.tag }}.apk
